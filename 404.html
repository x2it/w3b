<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="知行工作室 - 页面未找到" data-i18n-content="404.meta.description">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n-content="404.meta.title">页面未找到 · 知行工作室</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260725">
    <script src="/assets/js/i18n.js?v=20260725"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <style>
        /* 主题变量定义：见 /assets/css/style.css */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
            position: relative;
        }

        .theme-switcher {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            box-shadow: var(--card-shadow);
        }

        .theme-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: var(--card-shadow-hover);
        }

        .theme-panel {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.5rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            box-shadow: var(--card-shadow-hover);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }

        .theme-panel.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .theme-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .theme-option:hover {
            transform: scale(1.1);
        }

        .theme-option.active {
            border-color: var(--accent-color);
        }

        .theme-option[data-theme="system"] {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #10b981 100%);
        }

        .site-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: var(--dark-color);
            line-height: 1.2;
        }

        .site-subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 1.5rem;
            line-height: 1.5;
        }

        .error-section {
            text-align: center;
            padding: 4rem 1rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 300;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        .error-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .back-home {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(var(--accent-rgb, 99, 102, 241), 0.3);
        }

        @media (max-width: 768px) {
            header { padding: 2rem 1rem 1.5rem; }
            .error-section { padding: 3rem 1rem; }
        }

        @media (max-width: 480px) {
            .error-code { font-size: 4rem; }
            .error-section { padding: 2rem 1rem; }
            .back-home { padding: 0.7rem 1.5rem; font-size: 0.9rem; }
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        footer p { margin-bottom: 0.5rem; }

        .copyright { color: var(--text-light); font-size: 0.85rem; }
    </style>
</head>
<body>
    <!-- AI神经网络背景装饰 -->
    <svg class="neural-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.03; pointer-events: none;">
        <defs>
            <pattern id="neural-grid" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                <circle cx="100" cy="100" r="2" fill="currentColor"/>
                <circle cx="0" cy="0" r="1.5" fill="currentColor"/>
                <circle cx="200" cy="0" r="1.5" fill="currentColor"/>
                <circle cx="0" cy="200" r="1.5" fill="currentColor"/>
                <circle cx="200" cy="200" r="1.5" fill="currentColor"/>
                <circle cx="50" cy="50" r="1" fill="currentColor"/>
                <circle cx="150" cy="50" r="1" fill="currentColor"/>
                <circle cx="50" cy="150" r="1" fill="currentColor"/>
                <circle cx="150" cy="150" r="1" fill="currentColor"/>
                <line x1="100" y1="100" x2="50" y2="50" stroke="currentColor" stroke-width="0.5"/>
                <line x1="100" y1="100" x2="150" y2="50" stroke="currentColor" stroke-width="0.5"/>
                <line x1="100" y1="100" x2="50" y2="150" stroke="currentColor" stroke-width="0.5"/>
                <line x1="100" y1="100" x2="150" y2="150" stroke="currentColor" stroke-width="0.5"/>
                <line x1="50" y1="50" x2="150" y2="50" stroke="currentColor" stroke-width="0.3"/>
                <line x1="50" y1="150" x2="150" y2="150" stroke="currentColor" stroke-width="0.3"/>
                <line x1="50" y1="50" x2="50" y2="150" stroke="currentColor" stroke-width="0.3"/>
                <line x1="150" y1="50" x2="150" y2="150" stroke="currentColor" stroke-width="0.3"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#neural-grid)"/>
    </svg>

    <header>
        <div class="theme-switcher">
            <button class="theme-btn" id="themeBtn" title="切换主题">🎨</button>
            <div class="theme-panel" id="themePanel">
                <div class="theme-option" data-theme="default" style="background: linear-gradient(135deg, #f8fafc, #e2e8f0);"></div>
                <div class="theme-option" data-theme="dark" style="background: linear-gradient(135deg, #1e293b, #0f172a);"></div>
                <div class="theme-option" data-theme="blue" style="background: linear-gradient(135deg, #dbeafe, #bfdbfe);"></div>
                <div class="theme-option" data-theme="green" style="background: linear-gradient(135deg, #dcfce7, #bbf7d0);"></div>
                <div class="theme-option" data-theme="purple" style="background: linear-gradient(135deg, #f3e8ff, #e9d5ff);"></div>
                <div class="theme-option" data-theme="orange" style="background: linear-gradient(135deg, #ffedd5, #fed7aa);"></div>
                <div class="theme-option" data-theme="cyan" style="background: linear-gradient(135deg, #cffafe, #a5f3fc);"></div>
                <div class="theme-option" data-theme="system"></div>
            </div>
        </div>
        <h1 class="site-title" data-i18n="site.title">知行工作室</h1>
    </header>

    <section class="error-section">
        <div class="error-code">404</div>
        <p class="error-message" data-i18n="404.message">
            页面未找到<br>
            您访问的页面可能已被移除或暂时不可用
        </p>
        <a href="/" class="back-home" data-i18n="404.back">返回首页</a>
    </section>

    <footer>
        <p style="color: var(--text-secondary); font-size: 0.85rem; text-align: center;" data-i18n="footer.quote">"知之真切笃实处即是行，行之明觉精察处即是知。"</p>
        <p style="color: var(--text-secondary); font-size: 0.8rem; text-align: center;" data-i18n="footer.quote.source">— 王阳明 · 《传习录》</p>
        <p class="copyright" data-i18n="footer.copyright">© 2026 知行工作室 - 理会 · 践行</p>
    </footer>

    <script>
        (function() {
            // 主题切换逻辑
            const themes = ['default', 'dark', 'blue', 'green', 'purple', 'orange', 'cyan', 'system'];
            const themeBtn = document.getElementById('themeBtn');
            const themePanel = document.getElementById('themePanel');
            const themeOptions = document.querySelectorAll('.theme-option');

            function applyTheme(themeName) {
                document.body.classList.remove(...themes.map(t => t + '-mode'));
                if (themeName === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (prefersDark) {
                        document.body.classList.add('dark-mode');
                    }
                } else {
                    document.body.classList.add(themeName + '-mode');
                }
                localStorage.setItem('theme', themeName);
                themeOptions.forEach(opt => opt.classList.toggle('active', opt.dataset.theme === themeName));
            }

            function initTheme() {
                const savedTheme = localStorage.getItem('theme') || 'default';
                applyTheme(savedTheme);
            }

            themeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                themePanel.classList.toggle('show');
            });

            themeOptions.forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    applyTheme(this.dataset.theme);
                    themePanel.classList.remove('show');
                });
            });

            document.addEventListener('click', function(e) {
                if (!themePanel.contains(e.target) && !themeBtn.contains(e.target)) {
                    themePanel.classList.remove('show');
                }
            });

            initTheme();

            // i18n
            var navLang = navigator.language || '';
            var cl = localStorage.getItem('w3b_lang') ||
                (navLang.match(/^zh-(TW|HK|MO)$/i) ? 'zh-TW' :
                 navLang.match(/^zh(-Hant)?$/i) ? 'zh' : 'en');
            var I18N = window.I18N || null;
            var i18nReady = !!(I18N && I18N.zh);
            function t(k) {
                if (!i18nReady) return null;
                try {
                    var d = I18N[cl] || I18N['zh'];
                    if (d && d[k]) return d[k];
                    if (I18N['zh'] && I18N['zh'][k]) return I18N['zh'][k];
                    return null;
                } catch(e) { return null; }
            }
            if (i18nReady) {
                document.documentElement.lang = cl === 'zh-TW' ? 'zh-TW' : cl === 'en' ? 'en' : 'zh-CN';
                document.querySelectorAll('[data-i18n]').forEach(function(el) { var v = t(el.getAttribute('data-i18n')); if (v) el.textContent = v; });
                document.querySelectorAll('[data-i18n-content]').forEach(function(el) { var v = t(el.getAttribute('data-i18n-content')); if (v) el.setAttribute('content', v); });
                var title = t('404.meta.title');
                if (title) document.title = title;
            }
        })();
    </script>
</body>
</html>
