<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ===== GEO / 地理定位与服务区域（搜索引擎 Geo 爬虫识别） ===== -->
    <meta name="geo.position" content="30.5728;104.0668">
    <meta name="geo.region" content="CN-SC">
    <meta name="geo.placename" content="Chengdu, Sichuan">
    <meta name="geo.country" content="CN">
    <meta name="ICBM" content="30.5728, 104.0668">
    <meta name="DCTERMS.coverage" content="China (CN-SC / HK / MO / TW) & Global">
    <!-- ===== hreflang / 三语交替语言（Google 多语言搜索分发） ===== -->
    <link rel="alternate" hreflang="zh-CN" href="https://w3b.pub/404.html">
    <link rel="alternate" hreflang="zh-TW" href="https://w3b.pub/404.html">
    <link rel="alternate" hreflang="en" href="https://w3b.pub/404.html">
    <link rel="alternate" hreflang="x-default" href="https://w3b.pub/404.html">
    <!-- Open Graph (404 仅最小化，不影响 noindex) -->
    <meta property="og:locale" content="zh_CN">
    <meta property="og:locale:alternate" content="zh_TW">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:image" content="https://w3b.pub/favicon.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:image" content="https://w3b.pub/favicon.svg">
    <meta name="description" content="知行工作室 - 页面未找到" data-i18n-content="404.meta.description">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n-content="404.meta.title">页面未找到 · 知行工作室</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=3.0.1">
    <script src="/assets/js/i18n.js?v=3.0.1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <style>
        /* 主题变量定义：见 /assets/css/style.css */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
            position: relative;
        }

        .theme-switcher {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            box-shadow: var(--card-shadow);
        }

        .theme-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: var(--card-shadow-hover);
        }

        .theme-panel {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.5rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            box-shadow: var(--card-shadow-hover);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }

        .theme-panel.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .theme-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .theme-option:hover {
            transform: scale(1.1);
        }

        .theme-option.active {
            border-color: var(--accent-color);
        }

        .theme-option[data-theme="system"] {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #10b981 100%);
        }

        .site-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: var(--dark-color);
            line-height: 1.2;
        }

        .site-subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 1.5rem;
            line-height: 1.5;
        }

        .error-section {
            text-align: center;
            padding: 4rem 1rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 300;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        .error-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .back-home {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(var(--accent-rgb, 99, 102, 241), 0.3);
        }

        @media (max-width: 768px) {
            header { padding: 2rem 1rem 1.5rem; }
            .error-section { padding: 3rem 1rem; }
        }

        @media (max-width: 480px) {
            .error-code { font-size: 4rem; }
            .error-section { padding: 2rem 1rem; }
            .back-home { padding: 0.7rem 1.5rem; font-size: 0.9rem; }
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        footer p { margin-bottom: 0.5rem; }

        .copyright { color: var(--text-light); font-size: 0.85rem; }
    </style>
</head>
<body>
    <a href="#error-section" class="skip-link" data-i18n="aria.skip">跳到主内容</a>
    <!-- 风格装饰层（固定背景/侧边/网格，随 data-theme-style 切换） -->
    <div class="theme-deco" aria-hidden="true">
        <div class="theme-deco__corner theme-deco__corner--tl theme-deco__parallax"></div>
        <div class="theme-deco__corner theme-deco__corner--br theme-deco__parallax"></div>
        <div class="theme-deco__side theme-deco__side--l theme-deco__parallax"></div>
        <div class="theme-deco__side theme-deco__side--r theme-deco__parallax"></div>
        <div class="theme-deco__grid"></div>
    </div>
    <!-- AI神经网络背景装饰 -->
    <svg class="neural-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.03; pointer-events: none;">
        <defs>
            <pattern id="neural-grid" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                <circle cx="100" cy="100" r="2" fill="currentColor"/>
                <circle cx="0" cy="0" r="1.5" fill="currentColor"/>
                <circle cx="200" cy="0" r="1.5" fill="currentColor"/>
                <circle cx="0" cy="200" r="1.5" fill="currentColor"/>
                <circle cx="200" cy="200" r="1.5" fill="currentColor"/>
                <circle cx="50" cy="50" r="1" fill="currentColor"/>
                <circle cx="150" cy="50" r="1" fill="currentColor"/>
                <circle cx="50" cy="150" r="1" fill="currentColor"/>
                <circle cx="150" cy="150" r="1" fill="currentColor"/>
                <line x1="100" y1="100" x2="50" y2="50" stroke="currentColor" stroke-width="0.5"/>
                <line x1="100" y1="100" x2="150" y2="50" stroke="currentColor" stroke-width="0.5"/>
                <line x1="100" y1="100" x2="50" y2="150" stroke="currentColor" stroke-width="0.5"/>
                <line x1="100" y1="100" x2="150" y2="150" stroke="currentColor" stroke-width="0.5"/>
                <line x1="50" y1="50" x2="150" y2="50" stroke="currentColor" stroke-width="0.3"/>
                <line x1="50" y1="150" x2="150" y2="150" stroke="currentColor" stroke-width="0.3"/>
                <line x1="50" y1="50" x2="50" y2="150" stroke="currentColor" stroke-width="0.3"/>
                <line x1="150" y1="50" x2="150" y2="150" stroke="currentColor" stroke-width="0.3"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#neural-grid)"/>
    </svg>

    <header>
        <div class="theme-switcher">
            <button class="theme-btn" id="themeBtn" title="切换主题">🎨</button>
            <div class="theme-panel" id="themePanel">
                <div class="theme-option" data-theme="light" style="background: linear-gradient(135deg, #faf9f5, #e8e3d5); border-color: #5b5f97;"></div>
                <div class="theme-option" data-theme="blue" style="background: linear-gradient(135deg, #f4f7fb, #d7e2f1); border-color: #2563eb;"></div>
                <div class="theme-option" data-theme="purple" style="background: linear-gradient(135deg, #f6f3f8, #d9cde9); border-color: #7c3aed;"></div>
                <div class="theme-option" data-theme="teal" style="background: linear-gradient(135deg, #f2f7f8, #c9e2e5); border-color: #0d9488;"></div>
                <div class="theme-option" data-theme="dark" style="background: linear-gradient(135deg, #181828, #0d0d14); border-color: #94a3b8;"></div>
                <div class="theme-option" data-theme="green" style="background: linear-gradient(135deg, #16271e, #0f1a15); border-color: #059669;"></div>
                <div class="theme-option" data-theme="orange" style="background: linear-gradient(135deg, #251a0d, #1a1209); border-color: #b45309;"></div>
                <div class="theme-option" data-theme="system" style="background: linear-gradient(135deg, #faf9f5 50%, #0d0d14 50%); border-color: #5b5f97;"></div>
            </div>
        </div>
        <h1 class="site-title" data-i18n="site.title">知行工作室</h1>
    </header>

    <section class="error-section" id="error-section" role="main">
        <div class="error-code">404</div>
        <p class="error-message" data-i18n="404.message">
            页面未找到<br>
            您访问的页面可能已被移除或暂时不可用
        </p>
        <a href="/" class="back-home" data-i18n="404.back">返回首页</a>
    </section>

    <footer>
        <p style="color: var(--text-secondary); font-size: 0.85rem; text-align: center;" data-i18n="footer.quote">"知之真切笃实处即是行，行之明觉精察处即是知。"</p>
        <p style="color: var(--text-secondary); font-size: 0.8rem; text-align: center;" data-i18n="footer.quote.source">— 王阳明 · 《传习录》</p>
        <p class="copyright" data-i18n="footer.copyright">© 2026 知行工作室 - 理会 · 践行</p>
    </footer>

    

  <script src="assets/js/i18n-init.js?v=3.0.1" defer></script>
  <script src="assets/js/theme.js?v=3.0.1" defer></script>
  <script src="assets/js/balance.js?v=3.0.1" defer></script>
</body>
</html>
